name: Publish AGRO TAG berry harvesting route

on:
  workflow_run:
    workflows: ["Deploy GO BIG to GitHub Pages"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify-main-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Main artifact owns berry routes
        run: |
          echo "RU/EN/CZ berry-harvesting routes and video are now published by the main Pages workflow."
          echo "This legacy workflow intentionally performs no Pages deployment, preventing an older berry template from overwriting the validated final artifact."

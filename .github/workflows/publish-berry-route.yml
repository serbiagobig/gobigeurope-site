name: Publish AGRO TAG berry harvesting route

on:
  workflow_run:
    workflows: ["Publish GO BIG blog route"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages-berry-final"
  cancel-in-progress: true

jobs:
  add-berry-case-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download multilingual Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: downloaded-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Add berry harvesting case in RU EN CZ
        run: |
          mkdir -p dist
          TARFILE=$(find downloaded-pages -type f -name '*.tar' | head -n 1)
          if [ -z "$TARFILE" ]; then
            echo "Pages tar artifact not found"
            exit 1
          fi
          tar -xf "$TARFILE" -C dist
          cp berry-harvesting.html dist/berry-harvesting.html
          cp berry-harvesting-web.mp4 dist/berry-harvesting-web.mp4
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/berry-harvesting.html')
          s = p.read_text(encoding='utf-8')

          old_problem = '''<section class="section"><div class="wrap problem"><div><div class="eyebrow">Проблема</div><h2>Когда урожай есть, а рабочих не хватает</h2><p class="lead">Ручная уборка ягод требует большого количества сезонного персонала именно в короткий период, когда урожай необходимо собрать быстро и с минимальными потерями.</p><div class="checks"><span>Снижение зависимости от сезонных рабочих</span><span>Более предсказуемые сроки уборки</span><span>Возможность обслуживать большие площади</span><span>Снижение операционных рисков</span></div></div><div class="photo"><img src="assets/project-agriculture.png" alt="Ягодная плантация"/></div></div></section>'''
          new_problem = '''<section class="section manual-problems"><div class="wrap"><div class="eyebrow">Типичные проблемы ручной уборки</div><h2>Когда урожай есть, а ручной сбор становится ограничением</h2><p class="lead manual-intro">Ручная уборка влияет не только на затраты. Она определяет скорость сбора, качество партии, возможность масштабировать площадь и срок хранения ягоды.</p>
          <div class="problem-group"><div class="problem-group-head"><span>Операционные ограничения</span><small>Люди · сроки · масштаб</small></div><div class="manual-grid">
            <article class="manual-card"><b>01</b><h3>Дефицит сезонных рабочих</h3><p>Нужное количество сборщиков трудно найти именно в короткий период пикового созревания.</p></article>
            <article class="manual-card"><b>02</b><h3>Рост стоимости ручного труда</h3><p>Увеличение стоимости рабочей силы напрямую повышает себестоимость уборки урожая.</p></article>
            <article class="manual-card"><b>03</b><h3>Непредсказуемые сроки уборки</h3><p>Производительность зависит от количества людей, их опыта, погоды и ежедневной доступности персонала.</p></article>
            <article class="manual-card"><b>04</b><h3>Ограничение масштаба хозяйства</h3><p>Чем больше площадь плантации, тем сложнее обеспечить достаточное количество сборщиков одновременно.</p></article>
          </div></div>
          <div class="problem-group quality-group"><div class="problem-group-head"><span>Риски для качества урожая</span><small>Ягода · зрелость · хранение</small></div><div class="manual-grid">
            <article class="manual-card"><b>05</b><h3>Повреждение ягод</h3><p>Сдавливание пальцами, падение и давление ягод друг на друга вызывают вмятины и микроповреждения.</p></article>
            <article class="manual-card"><b>06</b><h3>Удаление защитного воскового налёта</h3><p>Частые прикосновения ухудшают внешний вид ягоды и снижают её естественную защиту.</p></article>
            <article class="manual-card"><b>07</b><h3>Неоднородная зрелость партии</h3><p>Из-за усталости или недостаточного опыта сборщики могут снимать недозрелые и перезрелые ягоды.</p></article>
            <article class="manual-card"><b>08</b><h3>Перегрев и задержка охлаждения</h3><p>Низкая скорость сбора увеличивает время нахождения ягод на плантации, что сокращает срок хранения.</p></article>
          </div></div></div></section>'''
          if old_problem not in s:
              raise SystemExit('Original manual harvesting problem section not found')
          s = s.replace(old_problem, new_problem, 1)

          old_benefits = '<section class="section soft" id="benefits"><div class="wrap"><div class="eyebrow">Экономика уборки</div><h2>Производительность, которая меняет экономику</h2><div class="stats">'
          new_benefits = '''<section class="section soft" id="benefits"><div class="wrap"><div class="eyebrow">Эффективность</div><h2>Мы создаем новую экономику уборки</h2><p class="economy-subtitle">Производительность, которая меняет экономику</p><div class="economy-video"><video autoplay muted loop playsinline preload="metadata" poster="/assets/agro-card-05.png" aria-label="Механизированная уборка ягод"><source src="/berry-harvesting-web.mp4" type="video/mp4"></video></div><div class="stats">'''
          if old_benefits not in s:
              raise SystemExit('Target economics section heading not found')
          s = s.replace(old_benefits, new_benefits, 1)

          css = '''
          .manual-problems{background:#fff}
          .manual-problems .manual-intro{max-width:920px}
          .problem-group{margin-top:38px}
          .problem-group+.problem-group{margin-top:28px}
          .problem-group-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
          .problem-group-head span{font:700 24px/1.1 var(--serif);color:var(--navy)}
          .problem-group-head small{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
          .manual-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
          .manual-card{min-height:240px;padding:24px;border:1px solid var(--line);border-radius:22px;background:#f7f9f9}
          .quality-group .manual-card{background:#f1f6f3;border-color:#d6e5dd}
          .manual-card b{display:block;color:var(--green);font-size:28px;font-weight:800;line-height:1;letter-spacing:.02em}
          .manual-card h3{margin:18px 0 0;font:700 23px/1.08 var(--serif);color:var(--navy)}
          .manual-card p{margin:14px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
          .economy-subtitle{margin:18px 0 0;font:600 clamp(22px,2.3vw,30px)/1.25 var(--serif);color:#486985}
          .economy-video{margin-top:30px;aspect-ratio:16/9;border-radius:28px;overflow:hidden;background:#101f2b;box-shadow:0 18px 38px rgba(16,37,61,.12)}
          .economy-video video{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
          .dark .eyebrow{color:#6ee39f !important;font-size:13px !important;letter-spacing:.16em}
          .tech-card b{font-size:28px !important;line-height:1 !important;letter-spacing:.02em}
          @media(max-width:1100px){.manual-grid{grid-template-columns:repeat(2,1fr)}}
          @media(max-width:900px){.problem-group-head{align-items:flex-start;flex-direction:column}.manual-grid{grid-template-columns:1fr}.manual-card{min-height:0;padding:20px}.manual-card h3{font-size:21px}.economy-video{margin-top:24px;border-radius:22px}.tech-card b{font-size:26px !important}}
          '''
          s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python scripts/localize_berry.py dist
          python scripts/fix_berry_locales.py dist

      - name: Validate berry routes and language links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          required = [
              Path('dist/berry-harvesting.html'),
              Path('dist/en/berry-harvesting.html'),
              Path('dist/cz/berry-harvesting.html'),
          ]
          for p in required:
              if not p.exists() or p.stat().st_size < 10000:
                  raise SystemExit(f'Missing or unexpectedly small berry page: {p}')
          video = Path('dist/berry-harvesting-web.mp4')
          if not video.exists() or video.stat().st_size < 1000000:
              raise SystemExit('Berry harvesting video missing or unexpectedly small')
          for p in required:
              text = p.read_text(encoding='utf-8')
              if '/berry-harvesting-web.mp4' not in text or '<video' not in text:
                  raise SystemExit(f'Berry video is not linked in {p}')
              if 'manual-grid' not in text or 'economy-video' not in text:
                  raise SystemExit(f'Updated berry content blocks missing in {p}')
              if text.count('class="manual-card"') != 8:
                  raise SystemExit(f'Expected 8 manual-harvest problem cards in {p}')
          for p in required[1:]:
              text = p.read_text(encoding='utf-8')
              if re.search(r'[А-Яа-яЁё]', text):
                  leftovers = sorted(set(re.findall(r'[А-Яа-яЁё][А-Яа-яЁё\s–—,+./%0-9]*', text)))
                  print('Residual Cyrillic:', leftovers[:30])
                  raise SystemExit(f'Cyrillic remains in localized berry page: {p}')
          ru = required[0].read_text(encoding='utf-8')
          en = required[1].read_text(encoding='utf-8')
          cz = required[2].read_text(encoding='utf-8')
          if 'en/berry-harvesting.html' not in ru or 'cz/berry-harvesting.html' not in ru:
              raise SystemExit('RU berry language links are incorrect')
          if '../cz/berry-harvesting.html' not in en or '../berry-harvesting.html' not in en:
              raise SystemExit('EN berry language links are incorrect')
          if '../en/berry-harvesting.html' not in cz or '../berry-harvesting.html' not in cz:
              raise SystemExit('CZ berry language links are incorrect')
          print('PASS: berry harvesting case available in RU / EN / CZ with 8 manual-harvest problem cards')
          PY

      - name: Upload final Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy final site
        uses: actions/deploy-pages@v4

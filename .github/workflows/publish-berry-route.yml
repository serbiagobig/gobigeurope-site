name: Publish AGRO TAG berry harvesting route

on:
  workflow_run:
    workflows: ["Publish GO BIG blog route"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages-berry-final"
  cancel-in-progress: true

jobs:
  add-berry-case-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download multilingual Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: downloaded-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Add berry harvesting case in RU EN CZ
        run: |
          mkdir -p dist
          TARFILE=$(find downloaded-pages -type f -name '*.tar' | head -n 1)
          if [ -z "$TARFILE" ]; then
            echo "Pages tar artifact not found"
            exit 1
          fi
          tar -xf "$TARFILE" -C dist
          cp berry-harvesting.html dist/berry-harvesting.html
          cp berry-harvesting-web.mp4 dist/berry-harvesting-web.mp4
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/berry-harvesting.html')
          s = p.read_text(encoding='utf-8')

          old_hero = '<div class="hero-copy"><div class="kicker">AGRO TAG SELECTED TECHNOLOGY</div><h1>Механизированная уборка ягод для свежего рынка</h1>'
          new_hero = '<div class="hero-copy"><div class="kicker">Инновационная технология</div><h1>Воздушно-импульсная уборка</h1>'
          if old_hero not in s:
              raise SystemExit('Original berry hero heading not found')
          s = s.replace(old_hero, new_hero, 1)

          old_problem = '''<section class="section"><div class="wrap problem"><div><div class="eyebrow">Проблема</div><h2>Когда урожай есть, а рабочих не хватает</h2><p class="lead">Ручная уборка ягод требует большого количества сезонного персонала именно в короткий период, когда урожай необходимо собрать быстро и с минимальными потерями.</p><div class="checks"><span>Снижение зависимости от сезонных рабочих</span><span>Более предсказуемые сроки уборки</span><span>Возможность обслуживать большие площади</span><span>Снижение операционных рисков</span></div></div><div class="photo"><img src="assets/project-agriculture.png" alt="Ягодная плантация"/></div></div></section>'''
          new_problem = '''<section class="section manual-problems"><div class="wrap"><div class="eyebrow">Типичные проблемы ручной уборки</div><h2>Когда ручной сбор становится ограничением</h2><p class="lead manual-intro">Ручной сбор ограничивает скорость, масштаб хозяйства и стабильность качества ягоды.</p>
          <div class="problem-panels">
            <article class="problem-panel"><div class="panel-head"><span>Операционные ограничения</span><small>Люди · сроки · масштаб</small></div><div class="problem-list">
              <div class="problem-row"><b>01</b><span>Дефицит сезонных рабочих</span></div>
              <div class="problem-row"><b>02</b><span>Рост стоимости ручного труда</span></div>
              <div class="problem-row"><b>03</b><span>Непредсказуемые сроки уборки</span></div>
              <div class="problem-row"><b>04</b><span>Ограничение масштаба хозяйства</span></div>
            </div></article>
            <article class="problem-panel quality-panel"><div class="panel-head"><span>Риски для качества урожая</span><small>Ягода · зрелость · хранение</small></div><div class="problem-list">
              <div class="problem-row"><b>05</b><span>Повреждение ягод</span></div>
              <div class="problem-row"><b>06</b><span>Потеря защитного воскового налёта</span></div>
              <div class="problem-row"><b>07</b><span>Неоднородная зрелость партии</span></div>
              <div class="problem-row"><b>08</b><span>Перегрев и задержка охлаждения</span></div>
            </div></article>
          </div></div></section>'''
          if old_problem not in s:
              raise SystemExit('Original manual harvesting problem section not found')
          s = s.replace(old_problem, new_problem, 1)

          old_benefits = '<section class="section soft" id="benefits"><div class="wrap"><div class="eyebrow">Экономика уборки</div><h2>Производительность, которая меняет экономику</h2><div class="stats">'
          new_benefits = '''<section class="section soft" id="benefits"><div class="wrap"><div class="eyebrow">Эффективность</div><h2>Мы создаем новую экономику уборки</h2><p class="economy-subtitle">Производительность, которая меняет экономику</p><div class="economy-video"><video autoplay muted loop playsinline preload="metadata" poster="/assets/agro-card-05.png" aria-label="Механизированная уборка ягод"><source src="/berry-harvesting-web.mp4" type="video/mp4"></video></div><div class="stats">'''
          if old_benefits not in s:
              raise SystemExit('Target economics section heading not found')
          s = s.replace(old_benefits, new_benefits, 1)

          css = '''
          .hero-copy{max-width:930px !important}
          .hero .kicker{font-size:13px !important;letter-spacing:.16em !important;color:#71d0a0 !important;margin-bottom:14px}
          .hero h1{margin:0 !important;font-size:clamp(54px,5.8vw,82px) !important;line-height:.95 !important;text-transform:uppercase}
          .manual-problems{background:#fff;padding:66px 0 72px}
          .manual-problems h2{max-width:980px;font-size:clamp(42px,4.2vw,62px)}
          .manual-problems .manual-intro{max-width:850px;margin-top:14px;font-size:16px}
          .problem-panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}
          .problem-panel{padding:24px 26px 20px;border:1px solid var(--line);border-radius:24px;background:#f7f9f9}
          .quality-panel{background:#f1f6f3;border-color:#d6e5dd}
          .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding-bottom:13px;border-bottom:1px solid #d9e1e4}
          .panel-head span{font:700 23px/1.1 var(--serif);color:var(--navy)}
          .panel-head small{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);white-space:nowrap}
          .problem-list{display:grid;margin-top:4px}
          .problem-row{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;min-height:60px;border-bottom:1px solid #e1e7e9}
          .problem-row:last-child{border-bottom:0}
          .problem-row b{color:var(--green);font-size:23px;font-weight:800;line-height:1}
          .problem-row span{font:700 19px/1.18 var(--serif);color:var(--navy)}
          .economy-subtitle{margin:18px 0 0;font:600 clamp(22px,2.3vw,30px)/1.25 var(--serif);color:#486985}
          .economy-video{margin-top:30px;aspect-ratio:16/9;border-radius:28px;overflow:hidden;background:#101f2b;box-shadow:0 18px 38px rgba(16,37,61,.12)}
          .economy-video video{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
          .dark .eyebrow{color:#6ee39f !important;font-size:13px !important;letter-spacing:.16em}
          .tech-card b{font-size:28px !important;line-height:1 !important;letter-spacing:.02em}
          @media(max-width:900px){.hero h1{font-size:clamp(42px,11vw,62px) !important}.manual-problems{padding:54px 0}.problem-panels{grid-template-columns:1fr}.panel-head{align-items:flex-start;flex-direction:column}.problem-panel{padding:20px}.problem-row{grid-template-columns:48px 1fr}.problem-row span{font-size:18px}.economy-video{margin-top:24px;border-radius:22px}.tech-card b{font-size:26px !important}}
          '''
          s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python scripts/localize_berry.py dist
          python scripts/fix_berry_locales.py dist

      - name: Validate berry routes and language links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          required = [
              Path('dist/berry-harvesting.html'),
              Path('dist/en/berry-harvesting.html'),
              Path('dist/cz/berry-harvesting.html'),
          ]
          for p in required:
              if not p.exists() or p.stat().st_size < 10000:
                  raise SystemExit(f'Missing or unexpectedly small berry page: {p}')
          video = Path('dist/berry-harvesting-web.mp4')
          if not video.exists() or video.stat().st_size < 1000000:
              raise SystemExit('Berry harvesting video missing or unexpectedly small')
          for p in required:
              text = p.read_text(encoding='utf-8')
              if '/berry-harvesting-web.mp4' not in text or '<video' not in text:
                  raise SystemExit(f'Berry video is not linked in {p}')
              if 'problem-panels' not in text or 'economy-video' not in text:
                  raise SystemExit(f'Updated berry content blocks missing in {p}')
              if text.count('class="problem-row"') != 8:
                  raise SystemExit(f'Expected 8 compact problem rows in {p}')
          for p in required[1:]:
              text = p.read_text(encoding='utf-8')
              if re.search(r'[А-Яа-яЁё]', text):
                  leftovers = sorted(set(re.findall(r'[А-Яа-яЁё][А-Яа-яЁё\s–—,+./%0-9]*', text)))
                  print('Residual Cyrillic:', leftovers[:30])
                  raise SystemExit(f'Cyrillic remains in localized berry page: {p}')
          ru = required[0].read_text(encoding='utf-8')
          en = required[1].read_text(encoding='utf-8')
          cz = required[2].read_text(encoding='utf-8')
          if 'Инновационная технология' not in ru or 'Воздушно-импульсная уборка' not in ru:
              raise SystemExit('RU hero headline was not updated')
          if 'en/berry-harvesting.html' not in ru or 'cz/berry-harvesting.html' not in ru:
              raise SystemExit('RU berry language links are incorrect')
          if '../cz/berry-harvesting.html' not in en or '../berry-harvesting.html' not in en:
              raise SystemExit('EN berry language links are incorrect')
          if '../en/berry-harvesting.html' not in cz or '../berry-harvesting.html' not in cz:
              raise SystemExit('CZ berry language links are incorrect')
          print('PASS: berry harvesting case available in RU / EN / CZ with refined hero and compact problem panels')
          PY

      - name: Upload final Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy final site
        uses: actions/deploy-pages@v4

name: Publish GO BIG blog route

on:
  workflow_run:
    workflows: ["Deploy GO BIG to GitHub Pages"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify-main-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Main artifact owns blog route
        run: |
          echo "Blog, Projects, mobile navigation and RU/EN/CZ routes are now published by the main Pages workflow."
          echo "This legacy workflow intentionally performs no Pages deployment, preventing it from overwriting the validated final artifact."

name: Publish GO BIG blog route

on:
  workflow_run:
    workflows: ["Deploy GO BIG to GitHub Pages"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages-blog-final"
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site source
        uses: actions/checkout@v4

      - name: Download main Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: downloaded-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Unpack, add final routes, responsive layer, and wire menu
        run: |
          mkdir -p dist
          TARFILE=$(find downloaded-pages -type f -name '*.tar' | head -n 1)
          if [ -z "$TARFILE" ]; then
            echo "Pages tar artifact not found"
            find downloaded-pages -maxdepth 3 -type f -print
            exit 1
          fi
          tar -xf "$TARFILE" -C dist
          cp blog.html dist/blog.html
          cp projects.html dist/projects.html
          cp assets/blog-data.json dist/assets/blog-data.json
          cp assets/responsive-final.css dist/assets/responsive-final.css
          cp assets/universal-mobile-nav.css dist/assets/universal-mobile-nav.css
          cp assets/universal-mobile-nav.js dist/assets/universal-mobile-nav.js
          cp assets/partners-ecosystem-locales.css dist/assets/partners-ecosystem-locales.css
          cp assets/technology-ecosystem-locales.css dist/assets/technology-ecosystem-locales.css
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [
              'index.html', 'international.html', 'digital-ai.html', 'education-hr.html',
              'projects.html', 'blog.html', 'agro-tag.html', 'agro-tag-contact.html',
              'readiness.html'
          ]
          responsive_link = '<link id="responsive-final" rel="stylesheet" href="assets/responsive-final.css?v=20260902-1"/>'

          def disable_unpublished_project_links(html, page_name):
              card_pattern = re.compile(
                  r'<article\b(?P<attrs>[^>]*class=["\'][^"\']*(?:project-card|\bcard\b)[^"\']*["\'][^>]*)>(?P<body>.*?)</article>',
                  re.IGNORECASE | re.DOTALL,
              )
              def clean_card(match):
                  attrs = match.group('attrs')
                  body = match.group('body')
                  card = '<article' + attrs + '>' + body + '</article>'
                  if re.search(r'\bAGRO\s+TAG\b', card, re.IGNORECASE):
                      return card
                  def anchor_to_span(a):
                      attrs2 = a.group('attrs')
                      inner = a.group('inner')
                      cls_match = re.search(r'class=["\']([^"\']*)["\']', attrs2, re.IGNORECASE)
                      classes = cls_match.group(1) if cls_match else ''
                      if not re.search(r'(^|\s)(?:project-more|more)(\s|$)', classes):
                          return a.group(0)
                      class_attr = f' class="{classes}"' if classes else ''
                      return f'<span{class_attr} aria-disabled="true" data-project-pending="true">{inner}</span>'
                  body2 = re.sub(
                      r'<a\b(?P<attrs>[^>]*)>(?P<inner>.*?)</a>',
                      anchor_to_span,
                      body,
                      flags=re.IGNORECASE | re.DOTALL,
                  )
                  return '<article' + attrs + '>' + body2 + '</article>'
              updated, count = card_pattern.subn(clean_card, html)
              if count:
                  print(f'{page_name}: inspected {count} project card(s); only AGRO TAG may retain a project CTA link')
              return updated

          for name in pages:
              p = Path('dist') / name
              if not p.exists():
                  raise SystemExit(f'Missing required page before localisation: {name}')
              s = p.read_text(encoding='utf-8')
              s = s.replace('href="#blog">Блог</a>', 'href="blog.html">Блог</a>')
              s = s.replace('href="assets/blog/">Блог</a>', 'href="blog.html">Блог</a>')
              s = s.replace('href="#projects">Проекты</a>', 'href="projects.html">Проекты</a>')

              if 'id="responsive-final"' not in s:
                  if '</head>' not in s:
                      raise SystemExit(f'Cannot inject responsive stylesheet: {name} has no </head>')
                  s = s.replace('</head>', responsive_link + '\n</head>', 1)

              if name == 'index.html':
                  labels = ['Обсудить задачу', 'Отправить запрос', 'Назначить встречу']
                  for label in labels:
                      s, count = re.subn(
                          rf'(<a\b[^>]*?href=")[^"]*("[^>]*>\s*{re.escape(label)}\s*</a>)',
                          r'\1international.html#application\2',
                          s,
                          count=1,
                          flags=re.IGNORECASE,
                      )
                      if count == 0:
                          print(f'Homepage button "{label}" not found')
                      else:
                          print(f'Homepage button "{label}" wired to international.html#application')

              if name == 'digital-ai.html':
                  old = 'href="mailto:companygobig@gmail.com?subject=GO%20BIG%20—%20цифровая%20трансформация">Обсудить задачу</a>'
                  new = 'href="international.html#application">Обсудить задачу</a>'
                  if old in s:
                      s = s.replace(old, new, 1)
                  else:
                      s, count = re.subn(
                          r'(<section class="cta" id="contact">.*?<a\b[^>]*?href=")[^"]*("[^>]*>\s*Обсудить задачу\s*</a>)',
                          r'\1international.html#application\2',
                          s,
                          count=1,
                          flags=re.IGNORECASE | re.DOTALL,
                      )
                      if count == 0:
                          raise SystemExit('Digital AI bottom CTA not found')

              s = disable_unpublished_project_links(s, name)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Generate English and Czech versions and inject universal mobile navigation
        run: |
          python scripts/localize_site_v2.py dist
          python scripts/localize_cleanup.py dist
          python scripts/inject_universal_mobile_nav.py dist
          python - <<'PY'
          from pathlib import Path
          targets = [
              ('ru', Path('dist/international.html'), 'assets'),
              ('en', Path('dist/en/international.html'), '../assets'),
              ('cz', Path('dist/cz/international.html'), '../assets'),
          ]
          for lang, p, asset_prefix in targets:
              s = p.read_text(encoding='utf-8')
              tags = [
                  f'<link id="partners-ecosystem-locales" rel="stylesheet" href="{asset_prefix}/partners-ecosystem-locales.css?v=20260902-2"/>',
                  f'<link id="technology-ecosystem-locales" rel="stylesheet" href="{asset_prefix}/technology-ecosystem-locales.css?v=20260902-1"/>',
              ]
              for tag in tags:
                  tag_id = re.search(r'id="([^"]+)"', tag).group(1)
                  if f'id="{tag_id}"' not in s:
                      s = s.replace('</head>', tag + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
              print(f'PASS {lang}/international.html: ecosystem data styles linked')
          PY

      - name: Validate routes, assets, localisation, responsive layer, and mobile navigation
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote
          import re

          root = Path('dist').resolve()
          pages = [
              'index.html', 'international.html', 'digital-ai.html', 'education-hr.html',
              'projects.html', 'blog.html', 'agro-tag.html', 'agro-tag-contact.html',
              'readiness.html'
          ]
          required = []
          for lang in ['', 'en', 'cz']:
              for page in pages:
                  required.append((Path(lang) / page) if lang else Path(page))

          missing = [str(p) for p in required if not (root / p).exists()]
          if missing:
              raise SystemExit('Missing final pages: ' + ', '.join(missing))

          required_assets = [
              root/'assets/responsive-final.css',
              root/'assets/universal-mobile-nav.css',
              root/'assets/universal-mobile-nav.js',
              root/'assets/partners-ecosystem-locales.css',
              root/'assets/technology-ecosystem-locales.css',
          ]
          for asset in required_assets:
              if not asset.exists() or asset.stat().st_size < 300:
                  raise SystemExit(f'Missing or unexpectedly small asset: {asset.name}')

          institution_css = (root/'assets/technology-ecosystem-locales.css').read_text(encoding='utf-8')
          required_institutions = [
              'Science and Technology Park Novi Sad',
              'Science and Technology Park Čačak',
              'Science and Technology Park of Republika Srpska',
              'Association of Farmers of Kazakhstan',
              'National Infrastructure Project “Turan”, Kyrgyz Republic',
              'Kyrgyz TechnoWomen',
          ]
          for item in required_institutions:
              if item not in institution_css:
                  raise SystemExit(f'Technology ecosystem institution missing: {item}')

          class RefParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  for key in ('href','src'):
                      if d.get(key): self.refs.append(d[key])

          errors=[]
          cyr=re.compile(r'[А-Яа-яЁё]')
          project_card_pattern = re.compile(
              r'<article\b[^>]*class=["\'][^"\']*(?:project-card|\bcard\b)[^"\']*["\'][^>]*>.*?</article>',
              re.IGNORECASE | re.DOTALL,
          )

          for rel in required:
              path=root/rel
              text=path.read_text(encoding='utf-8')
              if 'responsive-final.css' not in text:
                  errors.append(f'{rel}: responsive stylesheet not linked')
              if 'universal-mobile-nav.css' not in text or 'universal-mobile-nav.js' not in text:
                  errors.append(f'{rel}: universal mobile navigation assets not linked')
              if text.count('class="site-mobile-toggle"') != 1:
                  errors.append(f'{rel}: universal mobile toggle missing or duplicated')
              if text.count('class="site-mobile-nav"') != 1:
                  errors.append(f'{rel}: universal mobile overlay missing or duplicated')
              if str(rel).startswith(('en/','cz/')) and cyr.search(text):
                  errors.append(f'{rel}: Cyrillic text remains')
              if re.search(r'href=["\'](?:en|cz)\.html["\']', text, re.I):
                  errors.append(f'{rel}: legacy language link remains')
              if str(rel) in ('international.html','en/international.html','cz/international.html'):
                  if 'partners-ecosystem-locales.css' not in text:
                      errors.append(f'{rel}: partner ecosystem data stylesheet not linked')
                  if 'technology-ecosystem-locales.css' not in text:
                      errors.append(f'{rel}: technology ecosystem data stylesheet not linked')
              if str(rel) in ('digital-ai.html','en/digital-ai.html','cz/digital-ai.html'):
                  if 'href="international.html#application"' not in text:
                      errors.append(f'{rel}: Digital AI CTA is not wired to International application form')

              for card in project_card_pattern.findall(text):
                  if re.search(r'\bAGRO\s+TAG\b', card, re.IGNORECASE):
                      if 'agro-tag.html' not in card:
                          errors.append(f'{rel}: AGRO TAG project card lost its case link')
                  else:
                      if re.search(r'<a\b[^>]*class=["\'][^"\']*(?:project-more|\bmore\b)[^"\']*["\'][^>]*href=', card, re.IGNORECASE):
                          errors.append(f'{rel}: unpublished project card still contains an active CTA link')

              parser=RefParser(); parser.feed(text)
              for ref in parser.refs:
                  if ref.startswith(('#','mailto:','tel:','javascript:','data:','http://','https://','//')):
                      continue
                  local=ref.split('#',1)[0].split('?',1)[0]
                  if not local: continue
                  target=(path.parent / unquote(local)).resolve()
                  try: target.relative_to(root)
                  except ValueError: continue
                  if not target.exists():
                      errors.append(f'{rel}: missing local reference {ref}')

          if errors:
              for e in errors: print('ERROR:',e)
              raise SystemExit(f'Final site validation failed with {len(errors)} error(s)')
          print(f'PASS: {len(required)} HTML pages validated across RU/EN/CZ')
          print('PASS: local routes and assets resolve')
          print('PASS: responsive layer is linked on every page')
          print('PASS: universal hamburger navigation is present exactly once on every page')
          print('PASS: university, institution and technology ecosystem data are linked on RU/EN/CZ International')
          print('PASS: Digital AI CTA routes to the International application form on RU/EN/CZ')
          print('PASS: all unpublished project CTA links are disabled; AGRO TAG remains active')
          print('PASS: EN/CZ contain no Cyrillic and no legacy flat language links')
          PY

      - name: Upload final Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy final site
        uses: actions/deploy-pages@v4

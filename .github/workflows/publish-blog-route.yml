name: Publish GO BIG blog route

on:
  workflow_run:
    workflows: ["Deploy GO BIG to GitHub Pages"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages-blog-final"
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site source
        uses: actions/checkout@v4

      - name: Download main Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: downloaded-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Unpack, add blog and projects routes, and wire menu
        run: |
          mkdir -p dist
          TARFILE=$(find downloaded-pages -type f -name '*.tar' | head -n 1)
          if [ -z "$TARFILE" ]; then
            echo "Pages tar artifact not found"
            find downloaded-pages -maxdepth 3 -type f -print
            exit 1
          fi
          tar -xf "$TARFILE" -C dist
          cp blog.html dist/blog.html
          cp projects.html dist/projects.html
          cp assets/blog-data.json dist/assets/blog-data.json
          python - <<'PY'
          from pathlib import Path
          import re

          for name in ['international.html', 'index.html', 'digital-ai.html', 'education-hr.html', 'blog.html', 'projects.html']:
              p = Path('dist') / name
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('href="#blog">Блог</a>', 'href="blog.html">Блог</a>')
              s = s.replace('href="assets/blog/">Блог</a>', 'href="blog.html">Блог</a>')
              s = s.replace('href="#projects">Проекты</a>', 'href="projects.html">Проекты</a>')

              if name == 'index.html':
                  labels = ['Обсудить задачу', 'Отправить запрос', 'Назначить встречу']
                  for label in labels:
                      s, count = re.subn(
                          rf'(<a\b[^>]*?href=")[^"]*("[^>]*>\s*{re.escape(label)}\s*</a>)',
                          r'\1international.html#application\2',
                          s,
                          count=1,
                          flags=re.IGNORECASE,
                      )
                      if count == 0:
                          print(f'Homepage button "{label}" not found')
                      else:
                          print(f'Homepage button "{label}" wired to international.html#application')

              p.write_text(s, encoding='utf-8')
          PY

      - name: Extract visible Russian text for localisation
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          class TextCollector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip = 0
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag in {'script','style'}:
                      self.skip += 1
                  for k,v in attrs:
                      if k in {'placeholder','title','aria-label','alt','value'} and v and re.search(r'[А-Яа-яЁё]', v):
                          self.items.append(v.strip())
              def handle_endtag(self, tag):
                  if tag in {'script','style'} and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      t = ' '.join(data.split())
                      if t and re.search(r'[А-Яа-яЁё]', t):
                          self.items.append(t)

          for name in ['index.html','international.html','digital-ai.html','education-hr.html','projects.html','blog.html','agro-tag.html','agro-tag-contact.html']:
              p = Path('dist') / name
              if not p.exists():
                  continue
              c = TextCollector(); c.feed(p.read_text(encoding='utf-8'))
              seen=[]
              for x in c.items:
                  if x not in seen: seen.append(x)
              print(f'===I18N:{name}===')
              for x in seen:
                  print(x)
              print(f'===END:{name}===')
          PY

      - name: Upload final Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy final site
        uses: actions/deploy-pages@v4

name: Fix berry image visibility

on:
  workflow_run:
    workflows: ["Publish AGRO TAG berry harvesting route"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify-main-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Main artifact owns berry images
        run: |
          echo "Berry images, design and RU/EN/CZ routes are already part of the validated main Pages artifact."
          echo "No secondary Pages deployment is performed."

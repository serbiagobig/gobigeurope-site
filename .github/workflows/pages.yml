name: Deploy GO BIG to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build site
        run: sh build.sh

      - name: Merge partner heading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/agro-tag.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="kicker">Приглашаем к партнёрству</div><h2>Сильный оператор рынка, готовый строить систему</h2>'
          new = '<h2>Приглашаем к партнёрству сильного оператора рынка, готового строить систему</h2>'
          if old not in s:
              raise SystemExit('Partner heading block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Redeploy marker: Pages is now enabled; publish the current main branch.

name: Deploy GO BIG to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build site
        run: sh build.sh

      - name: Force partner heading typography
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/agro-tag.html')
          s = p.read_text(encoding='utf-8')
          old = '.partner .kicker{color:var(--rose);font-family:var(--serif);font-weight:600;letter-spacing:-.01em;text-transform:none;font-size:20px}'
          new = '.partner .kicker{color:var(--deep);font-family:var(--serif);font-weight:700;letter-spacing:-.03em;text-transform:none;font-size:clamp(42px,4.4vw,60px);line-height:.96;margin-bottom:18px}'
          if old not in s:
              raise SystemExit('Partner kicker style not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Redeploy marker: Pages is now enabled; publish the current main branch.

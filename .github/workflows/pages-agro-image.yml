name: Deploy GO BIG to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current published page
        run: |
          rm -rf dist
          mkdir -p dist/assets
          curl -fsSL "https://www.gobigeurope.com/agro-tag.html?ts=$(date +%s)" -o dist/agro-tag.html
          cp "AGRO TAG CENTR.png" dist/assets/agro-tag-center-wide.png

      - name: Replace benefits image
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('dist/agro-tag.html')
          s = p.read_text(encoding='utf-8')

          pattern = r'(<div class="service-image"><img src=")[^"]+(" alt="[^"]*"/?></div>)'
          replacement = r'\1assets/agro-tag-center-wide.png\2'
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('Benefits image block not found')

          p.write_text(s, encoding='utf-8')
          PY
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

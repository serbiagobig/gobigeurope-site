name: Deploy GO BIG to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build complete site with all assets
        run: sh build.sh

      - name: Add AGRO TAG images
        run: |
          cp "AGRO TAG CENTR.png" dist/assets/agro-tag-center.png
          cp "карточка_1-removebg-preview.png" dist/assets/agro-card-01.png

      - name: Replace AGRO TAG product images with local assets
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('dist/agro-tag.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'https://shop.fpm.rs/media/catalogProduct/teskaFrezaRotas2606/FPM-ROTAS.png': 'assets/agro-card-01.png',
              'https://agria.rs/wp-content/uploads/2023/08/zitka-featured-image.webp': 'assets/project-agriculture.png',
              'https://bsk.rs/uploads/ck_editor/images/Rotoprotect-home.jpg': 'assets/agro-soil-no-logo.svg',
              'https://agria.rs/wp-content/uploads/2023/08/psp-agria-img.webp': 'assets/project-agriculture.png',
              'https://site.caes.uga.edu/smallfruits/files/2022/07/BBHarvest-Photo1-1024x678.jpg': 'assets/project-agriculture.png',
              'https://www.lifam-m.com/wp-content/uploads/2022/04/Nenaslovljeni-dizajn-1.jpg': 'assets/agro-tag-facade-white.webp',
              'https://agria.rs/wp-content/uploads/2023/08/services-agria-image.webp': 'assets/agro-tag-center.png',
              'https://www.fpm.rs/media/catalogProduct/mulcarZaRatarstvo/Mulcar-za-ratarstvo-1.png': 'assets/project-agriculture.png',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply final AGRO TAG benefits layout
        run: |
          cp assets/agro-benefits-final.css dist/assets/agro-benefits-final.css
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/agro-tag.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="assets/agro-benefits-final.css?v=20260901-2">'
          if link not in s:
              s = s.replace('</head>', link + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

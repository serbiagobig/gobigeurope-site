name: Deploy GO BIG to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build complete site with all assets
        run: sh build.sh

      - name: Add AGRO TAG images and contact form
        run: |
          cp "AGRO TAG CENTR.png" dist/assets/agro-tag-center.png
          cp "карточка_1-removebg-preview.png" dist/assets/agro-card-01.png
          cp "Карточка 2.png" dist/assets/agro-card-02.png
          cp "Карточка 3.png" dist/assets/agro-card-03.png
          cp "Карточка 4.png" dist/assets/agro-card-04.png
          cp "Карточка 5.png" dist/assets/agro-card-05.png
          cp "Карточка 6.png" dist/assets/agro-card-06.png
          cp "Карточка 7.png" dist/assets/agro-card-07.png
          cp "Карточка 8.png" dist/assets/agro-card-08.png
          cp "Центральная Азия.png" dist/assets/central-asia.png
          cp assets/agro-tag-contact.html dist/agro-tag-contact.html

      - name: Replace AGRO TAG product images and partner visual
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('dist/agro-tag.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'https://shop.fpm.rs/media/catalogProduct/teskaFrezaRotas2606/FPM-ROTAS.png': 'assets/agro-card-01.png',
              'https://agria.rs/wp-content/uploads/2023/08/zitka-featured-image.webp': 'assets/agro-card-02.png',
              'https://bsk.rs/uploads/ck_editor/images/Rotoprotect-home.jpg': 'assets/agro-card-03.png',
              'https://agria.rs/wp-content/uploads/2023/08/psp-agria-img.webp': 'assets/agro-card-04.png',
              'https://site.caes.uga.edu/smallfruits/files/2022/07/BBHarvest-Photo1-1024x678.jpg': 'assets/agro-card-05.png',
              'https://www.lifam-m.com/wp-content/uploads/2022/04/Nenaslovljeni-dizajn-1.jpg': 'assets/agro-card-06.png',
              'https://agria.rs/wp-content/uploads/2023/08/services-agria-image.webp': 'assets/agro-card-07.png',
              'https://www.fpm.rs/media/catalogProduct/mulcarZaRatarstvo/Mulcar-za-ratarstvo-1.png': 'assets/agro-card-08.png',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          s = s.replace('Создадим новый центр агротехнологий', 'Станьте национальным или региональным партнёром AGRO TAG')

          placeholder = '<div class="partner-image-placeholder" role="img" aria-label="Место для изображения сельхозугодий в горной местности Центральной Азии"></div>'
          image = '<div class="partner-image-placeholder"><img src="assets/central-asia.png" alt="Сельхозугодья в горной местности Центральной Азии"/></div>'
          s = s.replace(placeholder, image)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Add partnership roles under center image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/agro-tag.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="center-visual"><img src="assets/agro-tag-center.png" alt="AGRO TAG CENTR"/></div>'
          new = '''<div class="center-left-stack"><div class="center-visual"><img src="assets/agro-tag-center.png" alt="AGRO TAG CENTR"/></div><div class="partnership-roles"><div class="role-line"><span class="role-label partner-label">ПАРТНЁР</span><span class="role-text">рынок · клиенты · продажи · логистика · сервис</span></div><div class="role-line"><span class="role-label tag-label">AGRO TAG</span><span class="role-text">продукция · технологии · координация · обучение</span></div><div class="role-line"><span class="role-label joint-label">СОВМЕСТНО</span><span class="role-text">запуск · склад · развитие · локализация</span></div><div class="role-key"><small>Ключевой критерий</small><strong>AGRO TAG — долгосрочное направление, а не разовая сделка.</strong></div></div></div>'''
          if old not in s:
              raise SystemExit('AGRO TAG center visual block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply final AGRO TAG benefits layout
        run: |
          cp assets/agro-benefits-final.css dist/assets/agro-benefits-final.css
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/agro-tag.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="assets/agro-benefits-final.css?v=20260901-4">'
          if link not in s:
              s = s.replace('</head>', link + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Refine AGRO TAG Central Asia section
        run: |
          cp assets/agro-asia-final.css dist/assets/agro-asia-final.css
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/agro-tag.html')
          s = p.read_text(encoding='utf-8')
          old = '''<section class="asia"><div class="wrap asia-shell"><div><div class="kicker">Центральная Азия</div><h2>Преференции сегодня. Локализация завтра.</h2><p class="lead" style="margin-top:24px">Казахстан и Кыргызстан входят в ЕАЭС. Соглашение о свободной торговле между Сербией и ЕАЭС действует с 10 июля 2021 года.</p><p class="legal-note">Для отдельных товаров сербского происхождения возможен преференциальный или беспошлинный режим. Применимость проверяется по коду ТН ВЭД, правилам происхождения, исключениям и документам конкретной поставки.</p></div><div><div class="ladder"><article class="rung"><b>01</b><h3>Импорт</h3><p>Готовая техника.</p></article><article class="rung"><b>02</b><h3>Сервис</h3><p>Склад и ремонт.</p></article><article class="rung"><b>03</b><h3>Сборка</h3><p>Узлы и комплектация.</p></article><article class="rung"><b>04</b><h3>Кооперация</h3><p>Компоненты и производство.</p></article></div><p class="legal-note">Преференции и локализация оцениваются отдельно для конкретной страны, товара и проекта.</p></div></div></section>'''
          new = '''<section class="asia"><div class="wrap asia-shell"><div class="asia-copy"><div class="kicker">Центральная Азия</div><h2>Преференции сегодня. Локализация завтра.</h2><p class="asia-main-note">Для отдельных товаров сербского происхождения возможен преференциальный или беспошлинный режим. Применимость проверяется по коду ТН ВЭД, правилам происхождения, исключениям и документам конкретной поставки.</p></div><div class="asia-path"><div class="ladder-kicker">Лестница развития</div><div class="ladder"><article class="rung"><b>01</b><h3>Импорт</h3><p>Готовая техника.</p></article><article class="rung"><b>02</b><h3>Сервис</h3><p>Склад и ремонт.</p></article><article class="rung"><b>03</b><h3>Сборка</h3><p>Узлы и комплектация.</p></article><article class="rung"><b>04</b><h3>Кооперация</h3><p>Компоненты и производство.</p></article></div><p class="legal-note">Преференции и локализация оцениваются отдельно для конкретной страны, товара и проекта.</p></div></div></section>'''
          if old not in s:
              raise SystemExit('AGRO TAG Central Asia section not found')
          s = s.replace(old, new, 1)
          link = '<link rel="stylesheet" href="assets/agro-asia-final.css?v=20260901-2">'
          if link not in s:
              s = s.replace('</head>', link + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Balance AGRO TAG initiator descriptions and wire contact form
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/agro-tag.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<p><strong>TESLA Alliance (Сербия)</strong></p>', '<p><strong>TESLA Alliance (Сербия)</strong> — международная бизнес-экосистема и координатор развития AGRO TAG на зарубежных рынках.</p>')
          s = s.replace('<p><strong>Go Big (Чешская Республика)</strong> — международный консалтинг, трансфер технологий и международные образовательные инициативы.</p>', '<p><strong>Go Big (Чешская Республика)</strong> — международный консалтинг, трансфер технологий и развитие бизнеса на зарубежных рынках.</p>')
          old_cta = '<a class="btn primary" href="mailto:info@atesla.rs?subject=AGRO%20TAG%20partnership">Связаться с нами</a>'
          new_cta = '<a class="btn primary" href="agro-tag-contact.html" target="_blank" rel="noopener">Связаться с нами</a>'
          if old_cta not in s:
              raise SystemExit('AGRO TAG contact CTA not found')
          s = s.replace(old_cta, new_cta, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Ensure homepage typography override and AGRO TAG card are loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="home-premium.css?v=20260901-7">'
          if 'home-premium.css' not in s:
              s = s.replace('</head>', link + '\n</head>', 1)

          new_card = '''<article class="project-card agro-tag-card"><img src="сельскохозяйственный_комплекс_на_закате.png" alt="AGRO TAG"/><div class="project-shade"></div><div class="project-top"><span class="project-type">Agro / Technology Transfer</span><span class="project-no">01</span></div><div class="project-copy"><h3>AGRO TAG</h3><p>Стратегия · партнёрство · трансфер технологий</p><a class="project-more" href="agro-tag.html">Подробнее</a></div></article>'''
          candidates = [
              '<article class="project-card"><img src="сельскохозяйственный_комплекс_на_закате.png" alt="Проект в сельском хозяйстве"/></article>',
              '<article class="project-card"><img src="assets/project-agriculture.png" alt="Проект в сельском хозяйстве"/></article>',
              '<article class="project-card"><img src="сельскохозяйственный_комплекс_на_закате.png" alt="Умное сельское хозяйство"/></article>',
          ]
          replaced = False
          for old_card in candidates:
              if old_card in s:
                  s = s.replace(old_card, new_card, 1)
                  replaced = True
                  break
          if not replaced and 'agro-tag-card' not in s:
              raise SystemExit('Homepage agriculture project card not found')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy GO BIG to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build complete site with all assets
        run: sh build.sh

      - name: Add full AGRO TAG CENTR image
        run: cp "AGRO TAG CENTR.png" dist/assets/agro-tag-center.png

      - name: Apply final AGRO TAG benefits layout
        run: |
          cp assets/agro-benefits-final.css dist/assets/agro-benefits-final.css
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/agro-tag.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="assets/agro-benefits-final.css?v=20260901-2">'
          if link not in s:
              s = s.replace('</head>', link + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
